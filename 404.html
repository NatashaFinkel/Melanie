<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>GuidanSes</title>
    <script>
        // Redirection pour GitHub Pages avec React Router
        // Stocke l'URL actuelle et redirige vers index.html
        var segmentCount = 1; // Nombre de segments dans le chemin (pour /Melanie/)
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
