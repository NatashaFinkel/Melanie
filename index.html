<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <link rel="icon" href="/assets/favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Les GuidanSes de Mélanie - Consultations tarot, astrologie et soins énergétiques">
  <!-- Préchargement critique des polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700;900&display=swap"
    rel="stylesheet">
  <!-- Font Awesome avec chargement asynchrone -->
  <script src="https://kit.fontawesome.com/6e3acb5797.js" crossorigin="anonymous" defer></script>
  <title>GuidanSes</title>

  <!-- Script pour GitHub Pages avec React Router -->
  <script>
    // Gestion de la redirection depuis 404.html
    (function (l) {
      if (l.search) {
        var q = {};
        l.search.slice(1).split('&').forEach(function (v) {
          var a = v.split('=');
          q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
        });
        if (q.p !== undefined) {
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + (q.p || '') +
            (q.q ? ('?' + q.q) : '') +
            l.hash
          );
        }
      }
    }(window.location))
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
